<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快照 - 科技与加密货币仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080A;--surface:#121214;--surface-2:#1A1A1C;--surface-3:#232326;
  --hairline:rgba(255,255,255,0.09);--hairline-2:rgba(255,255,255,0.14);--divider:rgba(255,255,255,0.06);
  --fg:#fff;--fg-2:rgba(255,255,255,0.66);--fg-3:rgba(255,255,255,0.42);--fg-4:rgba(255,255,255,0.26);
  --brand:#5227FF;--brand-400:#6C4FFF;--brand-700:#2509B3;--brand-t08:rgba(82,39,255,0.12);--brand-t16:rgba(82,39,255,0.20);
  --lime:#D1FF55;--up:#1ED760;--up-bg:rgba(20,167,57,0.14);--down:#FF5C42;--down-bg:rgba(233,80,50,0.14);--warning:#FFA940;
  --orange:#FFA940;--orange-tint:rgba(255,169,64,0.12);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1);--dur:.2s;--dur-fast:.12s;
  --maxw:1440px;--header-h:66px;
  --mono:'Fira Code','SF Mono',monospace;--sans:'Inter','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.5}
body{display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.up{color:var(--up)}.down{color:var(--down)}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:40;background:rgba(8,8,10,0.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--hairline);height:var(--header-h)}
.topbar__in{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,3vw,40px);display:flex;align-items:center;gap:20px;height:100%}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand__txt{min-width:0;display:flex;flex-direction:column}
.brand__title{font-weight:900;font-size:17px;line-height:1.2;letter-spacing:-.2px;white-space:nowrap}
.brand__title .accent{color:var(--lime)}
.brand__sub{font-size:11px;color:var(--fg-3);white-space:nowrap}
.topbar__spacer{flex:1}
.topbar__meta{display:flex;align-items:center;gap:14px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.live__dot{width:7px;height:7px;border-radius:50%;background:var(--brand-400);opacity:.7}
.back-link{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--surface);color:var(--fg-2);font-size:13px;white-space:nowrap;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.back-link:hover{background:var(--surface-2);border-color:var(--hairline-2);color:var(--fg)}
.back-link svg{width:15px;height:15px;flex-shrink:0}

/* ── Snap select ── */
.snap-select{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;width:120px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--hairline);background:var(--surface);color:var(--fg-2);font-size:13px;white-space:nowrap;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.snap-select:hover{background:var(--surface-2);border-color:var(--hairline-2);color:var(--fg)}
.snap-select svg{width:15px;height:15px;flex-shrink:0}
.snap-select .chev{width:13px;margin-left:auto;transition:transform var(--dur-fast) var(--ease)}
.snap-select--icon{width:38px;padding:0}
.snap-wrap{position:relative}
.snap-wrap.is-open .snap-select{background:var(--surface-2);border-color:var(--hairline-2);color:var(--fg)}
.snap-wrap.is-open .snap-select .chev{transform:rotate(180deg)}
.snap-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:50;width:240px;padding:6px;background:var(--surface);border:1px solid var(--hairline-2);border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,.4);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);max-height:380px;overflow-y:auto}
.snap-wrap.is-open .snap-menu{opacity:1;transform:none;pointer-events:auto}
.snap-menu__head{font-size:11px;color:var(--fg-3);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.4px}
.snap-menu__item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:var(--r-sm);font-size:13px;color:var(--fg-2);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease);cursor:pointer}
.snap-menu__item:hover{background:var(--surface-2);color:var(--fg)}
.snap-menu__item.is-active{background:var(--brand-t08);color:var(--brand-400);font-weight:600}

/* ── Shell ── */
.shell{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,3vw,40px)}

/* ── Section head ── */
.section__head{position:sticky;top:var(--header-h);bottom:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;margin-top:clamp(14px,2.2vw,24px);margin-bottom:6px;padding:0;height:var(--header-h)}
.section__title{font-size:19px;font-weight:900;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.section__title .bar{width:4px;height:18px;border-radius:2px;background:var(--lime);transition:box-shadow .4s var(--ease)}
.section__sub{font-size:12px;color:var(--fg-3);font-weight:400}
.grow{flex:1}

/* ── Card ── */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xl);display:flex;flex-direction:column}
.card__head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--divider)}
.card__title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;line-height:1.4}
.card__title svg{width:16px;height:16px;flex-shrink:0}

/* ── BTC KPI section ── */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.4vw,16px);margin-bottom:clamp(14px,2.2vw,24px)}
.kpi-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:clamp(16px,2.2vw,24px)}
.kpi-label{font-size:11px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.kpi-label .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi-val{font-family:var(--mono);font-size:clamp(20px,2.6vw,28px);font-weight:700;letter-spacing:-.3px;line-height:1.1}
.kpi-sub{font-family:var(--mono);font-size:12px;color:var(--fg-2);margin-top:6px}
.kpi-mcap{font-size:12px;color:var(--fg-3);margin-top:4px}

/* ── News row ── */
.feed__list{overflow-y:auto;flex:1;min-height:0;padding:6px}
.news-row{display:flex;flex-direction:column;gap:6px;padding:11px 12px;min-height:85px;border-radius:var(--r-md);transition:background var(--dur-fast) var(--ease);cursor:pointer}
.news-row+.news-row{border-top:1px solid var(--divider)}
.news-row:hover{background:var(--surface-2)}
.news-row__title{font-size:13.5px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.4em * 2)}
.news-row__title:hover{color:var(--brand)}
.news-row__meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--fg-3);min-height:16px;flex-wrap:nowrap}
.news-row__meta .stat{display:inline-flex;align-items:center;gap:3px}
.news-row__meta .stat svg{width:12px;height:12px;flex-shrink:0}
.news-row__meta .stat.up{color:var(--up)}
.news-row__meta .src{color:var(--fg-2);font-weight:600;padding:1px 7px;border-radius:var(--r-pill);background:var(--surface-3)}

/* ── Feeds grid ── */
.feeds{display:grid;gap:clamp(14px,1.6vw,20px);grid-template-columns:repeat(3,minmax(0,1fr))}

/* ── Error box ── */
.error-box{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-xl);padding:48px;text-align:center;max-width:480px;margin:100px auto;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.error-box h2{font-size:17px;font-weight:900;margin-bottom:10px}
.error-box p{color:var(--fg-3);font-size:13px}

/* ── Footer ── */
.foot{margin-top:40px;padding:22px 0;border-top:1px solid var(--hairline);display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.foot .srcs{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot .srcs span{padding:2px 10px;border-radius:var(--r-pill);background:var(--surface-2);font-size:11px}
.foot .grow{flex:1}
.foot__info{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}

/* ── Segmented control ── */
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-3);border-radius:var(--r-md);border:1px solid var(--hairline);height:38px;align-items:center}
.seg button{font-size:13px;font-weight:600;color:var(--fg-3);padding:7px 16px;border-radius:9px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.seg button.is-on{background:var(--lime);color:#1A1A1A}
.seg button:hover:not(.is-on){color:var(--fg)}

/* ── Exchange monitor (stub) ── */
.ex-panel{display:none}

/* ── Listings (stub) ── */

/* ── Responsive ── */
@media(max-width:1100px){
  .feeds{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:1fr 1fr}
  .feeds .card__head{min-height:0}
}
@media(max-width:760px){
  .topbar__in{gap:10px;padding:0 16px;flex-wrap:nowrap}
  .kpi-row{grid-template-columns:1fr}
  .brand__sub{display:none}
  .brand__title{font-size:15px}
  .snap-select:not(.snap-select--icon){min-width:0;width:auto}
  .snap-select span:not(.chev){display:none}
  .snap-menu{width:min(78vw,260px)}
  .section__title{font-size:17px}
  .feeds .card__head{flex-wrap:wrap}
  .foot{flex-wrap:wrap;align-items:center;gap:6px 8px}
  .foot .grow{display:none}
  .foot .srcs{flex-wrap:nowrap}
}
@media(max-width:420px){
  .news-row__meta{gap:7px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__in">
    <a class="brand" href="betanews.html">
      <span class="brand__txt">
        <span class="brand__title">科技与加密货币<span class="accent">仪表盘</span></span>
        <span class="brand__sub">Tech &amp; Crypto Monitor · 历史快照</span>
      </span>
    </a>
    <span class="topbar__spacer"></span>
    <div class="topbar__meta">
      <span class="live"><span class="live__dot"></span><span class="live__time">加载中...</span></span>
      <span class="snap-wrap" id="snap-wrap">
        <button class="snap-select" onclick="toggleSnap()" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span>历史快照</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div class="snap-menu" id="snap-menu"></div>
      </span>
      <a class="back-link" href="betanews.html" style="font-size:12px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>返回主页</span>
      </a>
    </div>
  </div>
</header>

<main class="shell" id="main">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px">
    <div style="width:36px;height:36px;border:3px solid var(--hairline);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite"></div>
    <div style="color:var(--fg-3);font-size:13px">加载快照数据...</div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</main>

<footer class="foot" id="foot" style="display:none">
  <span class="foot__info"><span>数据来源</span><span class="srcs"><span>Binance</span><span>OKX</span><span>Bitget</span><span>Bybit</span><span>Cointelegraph</span><span>Hacker News</span></span></span>
  <span class="grow"></span>
  <span>© 2026 · Peter · 每小时更新 · 快照查看器</span>
</footer>

<script>
var REPO='peterzhangbo/Dashboard';
var CDN_URLS=[
  'dashboard-snapshots.jsonl',
  'https://cdn.jsdelivr.net/gh/'+REPO+'@main/dashboard-snapshots.jsonl',
  'https://fastly.jsdelivr.net/gh/'+REPO+'@main/dashboard-snapshots.jsonl',
  'https://gcore.jsdelivr.net/gh/'+REPO+'@main/dashboard-snapshots.jsonl'
];

function fetchWithTimeout(url,timeout,opts){
  return new Promise(function(resolve,reject){
    var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
    var timer;
    if(ctrl){timer=setTimeout(function(){ctrl.abort()},timeout||8000)}
    fetch(url,Object.assign({signal:ctrl?ctrl.signal:undefined},opts||{})).then(function(r){
      if(!r.ok)throw new Error(r.status);return r.text();
    }).then(function(t){if(timer)clearTimeout(timer);resolve(t)}).catch(reject);
  });
}

function loadJSONL(){
  function tryNext(i){
    if(i>=CDN_URLS.length){
      showError('无法加载快照数据，请检查网络后刷新重试');return;
    }
    var url=CDN_URLS[i];
    fetchWithTimeout(url,8000,url.startsWith('http')?{mode:'cors'}:undefined).then(function(txt){
      parseSnaps(txt);
    }).catch(function(){tryNext(i+1)});
  }
  tryNext(0);
}

function parseSnaps(txt){
  var snaps=[];
  txt.trim().split('\n').forEach(function(l){try{var o=JSON.parse(l);if(o.ts)snaps.push(o)}catch(e){}});
  snaps.reverse();
  if(!snaps.length){showError('暂无可用快照');return}
  var hash=location.hash.replace('#','');
  var idx=parseInt(hash);
  if(isNaN(idx)||idx<0)idx=0;
  if(idx>=snaps.length)idx=snaps.length-1;
  renderSnap(snaps[idx],idx,snaps.length);
  loadSnapMenu(snaps,idx);
}

function showError(msg){
  var main=document.getElementById('main');
  main.innerHTML='<div class="error-box"><h2>加载失败</h2><p>'+msg+'</p></div>';
  document.getElementById('foot').style.display='';
}

function esc(s){
  if(!s)return'';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function ft_ts(ts){
  ts=parseInt(ts);if(ts>1e12)ts=ts/1000;
  var d=new Date(ts*1000);
  var mm=String(d.getMonth()+1).padStart(2,'0');
  var dd=String(d.getDate()).padStart(2,'0');
  var hh=String(d.getHours()).padStart(2,'0');
  var mi=String(d.getMinutes()).padStart(2,'0');
  return '<time data-epoch="'+ts+'">'+mm+'-'+dd+' '+hh+':'+mi+'</time>';
}

/* ── Render snapshot in beta dashboard layout ── */
function renderSnap(s,idx,total){
  var d=new Date(s.ts);
  var timeStr=d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var btc=s.btc||{};
  var btcP=btc.price||0;
  var btcC=btc.change||0;
  var btcM=btc.mcap||0;
  var btcCls=btcC>=0?'up':'down';
  var btcArrow=btcC>=0?'▲':'▼';
  var btcMcapStr=(btcM/1e12).toFixed(2);
  var btcTime=d.toISOString().slice(0,16).replace('T',' ');

  var navPrev=(idx>0)?'<button class="nav-btn" onclick="navTo('+(idx-1)+')">← 上一条</button>':'<button class="nav-btn" disabled style="opacity:.3;cursor:not-allowed">← 上一条</button>';
  var navNext=(idx<total-1)?'<button class="nav-btn" onclick="navTo('+(idx+1)+')">下一条 →</button>':'<button class="nav-btn" disabled style="opacity:.3;cursor:not-allowed">下一条 →</button>';

  var h='';

  /* ── BTC KPI ── */
  h+='<div class="section__head"><h2 class="section__title"><span class="bar"></span>BTC 概况</h2>';
  h+='<span class="section__sub">快照 #'+(idx+1)+'/'+total+' · <span style="font-family:var(--mono)">'+timeStr+'</span></span></div>';
  h+='<div class="kpi-row">';
  h+='<div class="kpi-card"><div class="kpi-label"><span class="dot" style="background:#f7931a"></span>BTC 价格</div>';
  h+='<div class="kpi-val">$'+Number(btcP).toLocaleString()+'</div>';
  h+='<div class="kpi-sub '+btcCls+'">'+btcArrow+' '+Math.abs(btcC).toFixed(2)+'%</div></div>';
  h+='<div class="kpi-card"><div class="kpi-label"><span class="dot" style="background:var(--brand)"></span>24h 涨跌</div>';
  h+='<div class="kpi-val '+btcCls+'">'+btcArrow+' '+Math.abs(btcC).toFixed(2)+'%</div>';
  h+='<div class="kpi-sub" style="color:var(--fg-4)">快照时刻变化率</div></div>';
  h+='<div class="kpi-card"><div class="kpi-label"><span class="dot" style="background:var(--up)"></span>市值</div>';
  h+='<div class="kpi-val">$'+btcMcapStr+'万亿</div>';
  h+='<div class="kpi-mcap">流通量约 '+Math.round(btcM/btcP).toLocaleString()+' BTC</div></div>';
  h+='</div>';

  /* ── Navigation ── */
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:clamp(14px,2.2vw,24px)">';
  h+=navPrev;
  h+='<span style="font-size:12px;color:var(--fg-3);font-family:var(--mono)">'+timeStr+'</span>';
  h+='<span class="grow"></span>';
  h+='<span style="font-size:11px;color:var(--fg-4)">( '+(idx+1)+' / '+total+' )</span>';
  h+=navNext;
  h+='</div>';

  /* ── 12h Listings (empty) ── */
  h+='<div id="section-listings" style="display:none">';
  h+='<div class="section__head"><h2 class="section__title"><span class="bar"></span>12h 内上线</h2><span class="section__sub"><span id="listings-count"></span></span></div>';
  h+='<div id="block-listings"></div></div>';

  /* ── Feeds ── */
  h+='<div class="section__head" id="head-feeds"><h2 class="section__title"><span class="bar"></span>行业资讯</h2>';
  h+='<span class="section__sub">快照数据 · Hacker News · 行业热点</span></div>';
  h+='<div class="feeds">';

  /* HN card */
  h+='<div class="card" id="hn-card">';
  h+='<div class="card__head">';
  h+='<span class="card__title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>Hacker News</span>';
  h+='<div class="tabs" id="hn-tabs">';
  h+='<button class="tab is-on" onclick="sortHN(\'score\')">最热</button>';
  h+='<button class="tab" onclick="sortHN(\'time\')">最新</button>';
  h+='<button class="tab" onclick="sortHN(\'comments\')">评论</button>';
  h+='</div></div>';
  h+='<div class="feed__list" id="hn-list">';
  var hn=s.hn||[];
  if(hn.length){
    for(var i=0;i<hn.length;i++){
      var item=hn[i];
      var url='https://news.ycombinator.com/item?id='+item.ts;
      h+='<a class="news-row" href="'+url+'" target="_blank" rel="noopener" data-score="'+item.s+'" data-time="'+item.ts+'" data-comments="'+item.c+'">';
      h+='<span class="news-row__title">'+esc(item.t)+'</span>';
      h+='<span class="news-row__meta">';
      h+='<span class="stat up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>'+item.s+'</span>';
      h+='<span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>'+item.c+'</span>';
      h+='<span class="mono">'+ft_ts(item.ts)+'</span>';
      h+='</span></a>';
    }
  }else{
    h+='<div style="padding:16px;color:var(--fg-3);font-size:11px">暂无数据</div>';
  }
  h+='</div></div>';

  /* CT card */
  h+='<div class="card"><div class="card__head">';
  h+='<span class="card__title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>行业热点</span>';
  h+='</div>';
  h+='<div class="feed__list">';
  var ct=s.crypto||[];
  if(ct.length){
    for(var i=0;i<ct.length;i++){
      var item=ct[i];
      var tag=(item.tag||'Crypto');
      h+='<a class="news-row" href="https://cointelegraph.com/tags/'+tag.toLowerCase().replace(/\s+/g,'-')+'" target="_blank" rel="noopener">';
      h+='<span class="news-row__title">'+esc(item.t)+'</span>';
      h+='<span class="news-row__meta">';
      h+='<span class="src">'+esc(tag)+'</span>';
      h+='<span class="mono">CoinTelegraph</span>';
      h+='</span></a>';
    }
  }else{
    h+='<div style="padding:16px;color:var(--fg-3);font-size:11px">暂无数据</div>';
  }
  h+='</div></div>';

  h+='</div>'; /* feeds */

  /* ── Exchange monitor (hidden) ── */
  h+='<div style="display:none">';
  h+='<div class="section__head"><h2 class="section__title"><span class="bar"></span>竞品监控</h2>';
  h+='<div class="seg" id="segMetric"><button class="is-on" data-metric="vol" onclick="switchExTab(\'vol\')">1h 成交额</button></div></div>';
  h+='<div class="card"><div class="ex-panel" id="etab-vol"></div></div>';
  h+='</div>';

  document.getElementById('main').innerHTML=h;
  document.getElementById('foot').style.display='';

  /* Local timezone conversion */
  convertTimes();
  /* Auto-reload on snapshot update time */
  var updateMs=d.getTime();
  var reloadMs=updateMs+65*60*1000;
  var delay=reloadMs-Date.now();
  if(delay>0)setTimeout(function(){location.reload()},delay);
}

/* ── Local timezone ── */
function convertTimes(){
  var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  var offset=-new Date().getTimezoneOffset();
  var sign=offset>=0?'+':'';
  var totalMin=Math.abs(offset);
  var h=Math.floor(totalMin/60);
  var m=totalMin%60;
  var label=m>0?sign+h+':'+String(m).padStart(2,'0'):sign+h;
  document.querySelectorAll('time[data-epoch]').forEach(function(el){
    var d=new Date(parseInt(el.dataset.epoch)*1000);
    el.textContent=d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:tz});
  });
  var hdr=document.querySelector('.live__time');
  if(hdr){
    var d=new Date(hdr.dataset.ts);
    var mobile=window.innerWidth<=760;
    if(mobile){
      hdr.textContent=d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:tz})+' (UTC'+label+')';
    }else{
      hdr.textContent=d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:tz})+' (UTC'+label+')';
    }
  }
}

/* ── HN sort ── */
function sortHN(key){
  var labels={score:'最热',time:'最新',comments:'评论'};
  document.querySelectorAll('#hn-tabs .tab').forEach(function(b){b.classList.toggle('is-on',b.textContent===labels[key])});
  var list=document.getElementById('hn-list');
  var items=Array.from(list.querySelectorAll('.news-row'));
  items.sort(function(a,b){return(parseInt(b.dataset[key])||0)-(parseInt(a.dataset[key])||0)});
  items.forEach(function(item){list.appendChild(item)});
}

/* ── Exchange tab stub ── */
function switchExTab(id){}

/* ── Snap menu (navigate inline) ── */
var _allSnaps=[];
function loadSnapMenu(snaps,idx){
  _allSnaps=snaps;
  var menu=document.getElementById('snap-menu');
  menu.innerHTML='';
  snaps.forEach(function(s,i){
    var d=new Date(s.ts);
    var t=document.createElement('div');
    t.className='snap-menu__item'+(i===idx?' is-active':'');
    var btcStr='';
    if(s.btc)btcStr=' · $'+Number(s.btc.price).toLocaleString()+' '+(s.btc.change>=0?'+':'')+s.btc.change.toFixed(2)+'%';
    t.innerHTML='<span style="font-family:var(--mono);font-weight:500">'+d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span><span>'+btcStr+'</span>';
    t.onclick=function(){location.hash='#'+i;location.reload()};
    menu.appendChild(t);
  });
  /* Set live time from current snapshot */
  var hdr=document.querySelector('.live__time');
  if(hdr)hdr.dataset.ts=snaps[idx].ts;
}
function toggleSnap(){document.getElementById('snap-wrap').classList.toggle('is-open');if(document.getElementById('snap-wrap').classList.contains('is-open')&&!_allSnaps.length)loadJSONL()}
function navTo(idx){location.hash='#'+idx;location.reload()}

/* ── Click outside to close ── */
document.addEventListener('click',function(e){
  if(!e.target.closest('.snap-wrap'))document.getElementById('snap-wrap').classList.remove('is-open');
});

/* ── Init ── */
(function(){
  var hash=location.hash.replace('#','');
  var idx=parseInt(hash);
  if(isNaN(idx)||idx<0)idx=0;
  loadJSONL();
})();
</script>
